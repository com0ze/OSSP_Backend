spring:
  datasource:
    url: jdbc:mysql://localhost:3306/test_db?useSSL=false&serverTimezone=Asia/Seoul
    username: root         # 본인의 MySQL 아이디 (보통 root)
    password: 0925    # 본인의 MySQL 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop # 마법의 주문: 테스트 시작 시 테이블 생성, 끝나면 전부 삭제
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true          # 콘솔에 쿼리문을 예쁘게 보여줍니다.