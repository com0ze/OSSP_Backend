spring.application.name=OSSP_BackEnd

# DB 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/ossp_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=0925

# 드라이버 설정 (MySQL 8.x 기준)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 서버가 켜질 때 엔티티를 기준으로 DB 테이블을 자동으로 생성/수정해라!
spring.jpa.hibernate.ddl-auto=update