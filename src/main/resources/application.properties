spring.application.name=OSSP_BackEnd

# 학교 서버 DB 연결 주소 (SSH 터널링 상태: 주로 localhost:3522 사용)
spring.datasource.url=jdbc:mysql://localhost:3522/OSSP?serverTimezone=Asia/Seoul

# 데이터베이스 접속 계정 정보
spring.datasource.username=root

# 데이터베이스 접속 비밀번호
spring.datasource.password=kh01381010@@

# 하이버네이트(JPA) 설정: 자바 코드를 분석해 DB에 자동으로 테이블을 생성/업데이트함
spring.jpa.hibernate.ddl-auto=update

# 개발 편의성: 실행되는 SQL 쿼리를 콘솔로그에 출력함
spring.jpa.show-sql=true

# (선택) 경고 로그 방지용 설정
spring.jpa.open-in-view=false