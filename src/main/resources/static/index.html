<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>STOMP 실시간 채팅 테스트 (순수 웹소켓)</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #chat-box { width: 500px; height: 300px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9; }
        .msg { margin-bottom: 8px; padding: 8px; background: #fff; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .log-msg { color: #888; font-size: 12px; margin-bottom: 5px; }
        input, button { padding: 5px; margin-right: 5px; }
    </style>
</head>
<body>

<h2>STOMP 채팅 테스트 (Flutter 연동 대비용)</h2>

<div>
    <button onclick="connect()" id="btn-connect">1. 서버 연결하기 (Connect)</button>
    <button onclick="disconnect()" disabled id="btn-disconnect">연결 끊기</button>
</div>
<br>

<div>
    <input type="number" id="roomId" placeholder="채팅방 번호 (예: 1)" value="1">
    <button onclick="subscribe()" disabled id="btn-sub">2. 방 구독하기 (Subscribe)</button>
</div>
<br>

<div id="chat-box"></div>

<div>
    <input type="number" id="senderId" placeholder="내 유저 ID" value="123" style="width: 80px;">
    <input type="text" id="message" placeholder="보낼 메시지 입력" style="width: 250px;">
    <button onclick="sendMessage()" disabled id="btn-send">3. 전송 (Send)</button>
</div>

<script>
    let stompClient = null;
    let currentSubscription = null;

    // 화면에 로그나 메시지를 띄워주는 헬퍼 함수
    function showLog(message, isChat = false) {
        const chatBox = document.getElementById('chat-box');
        const msgElement = document.createElement('div');
        msgElement.className = isChat ? 'msg' : 'log-msg';
        msgElement.textContent = message;
        chatBox.appendChild(msgElement);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function connect() {
        // 주의: 백엔드 WebSocketConfig에서 .withSockJS()가 반드시 제거(또는 주석처리)되어 있어야 합니다!
        const brokerURL = "ws://localhost:8080/ws-stomp";

        // 최신 라이브러리 규격인 StompJs.Client 사용
        stompClient = new StompJs.Client({
            brokerURL: brokerURL,
            reconnectDelay: 5000,
            heartbeatIncoming: 4000,
            heartbeatOutgoing: 4000,
            onConnect: function (frame) {
                showLog("✅ 서버와 순수 웹소켓 STOMP 연결 성공!");
                document.getElementById('btn-connect').disabled = true;
                document.getElementById('btn-disconnect').disabled = false;
                document.getElementById('btn-sub').disabled = false;
            },
            onStompError: function (frame) {
                showLog("❌ STOMP 에러 발생: " + frame.headers['message']);
            },
            onWebSocketError: function (event) {
                showLog("❌ 웹소켓 연결 에러! (서버가 켜져있는지, withSockJS()를 껐는지 확인하세요)");
            }
        });

        stompClient.activate();
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.deactivate();
        }
        showLog("🔌 연결이 끊어졌습니다.");
        document.getElementById('btn-connect').disabled = false;
        document.getElementById('btn-disconnect').disabled = true;
        document.getElementById('btn-sub').disabled = true;
        document.getElementById('btn-send').disabled = true;
    }

    function subscribe() {
        const roomId = document.getElementById('roomId').value;
        if (!roomId) return alert("채팅방 번호를 입력하세요.");

        // 기존에 구독한 방이 있다면 해제 (중복 수신 방지)
        if (currentSubscription) {
            currentSubscription.unsubscribe();
        }

        // API 명세서에 맞춘 구독 주소
        const topicPath = `/topic/rooms/${roomId}`;

        currentSubscription = stompClient.subscribe(topicPath, function (message) {
            // 수신된 JSON 메시지 파싱
            const receivedData = JSON.parse(message.body);
            showLog(`💬 [수신] 유저${receivedData.senderId} : ${receivedData.content}`, true);
        });

        showLog(`🔔 ${roomId}번 방을 구독했습니다. 이제 메시지를 받을 수 있습니다.`);
        document.getElementById('btn-send').disabled = false;
    }

    function sendMessage() {
        const roomId = document.getElementById('roomId').value;
        const senderId = document.getElementById('senderId').value;
        const content = document.getElementById('message').value;

        if (!content) return alert("메시지를 입력하세요.");

        // API 명세서에 맞춘 발송 JSON 데이터 구조
        const chatMessage = {
            roomId: parseInt(roomId),
            senderId: parseInt(senderId),
            content: content
        };

        // API 명세서에 맞춘 발송 주소 (/app/chat.send)
        stompClient.publish({
            destination: "/app/chat.send",
            body: JSON.stringify(chatMessage)
        });

        document.getElementById('message').value = '';
    }
</script>
</body>
</html>
